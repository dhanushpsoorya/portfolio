<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Resume Builder</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1400px; height: 640px; overflow: hidden; background: #d9dde3; font-family: "Segoe UI", sans-serif; color: #1c2430; }
    .window { margin: 18px; height: 604px; background: #f4f6f8; border-radius: 10px; overflow: hidden; box-shadow: 0 12px 40px rgba(20,24,30,.18); display: flex; flex-direction: column; }
    .titlebar { height: 42px; background: #1f4e45; color: #fff; display: flex; align-items: center; padding: 0 16px; font-size: 14px; gap: 8px; }
    .dots { display: flex; gap: 6px; }
    .dots i { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.45); display: block; }
    .body { flex: 1; display: grid; grid-template-columns: 460px 1fr; }
    form { padding: 22px 22px 18px; border-right: 1px solid #e1e5ea; }
    h1 { margin: 0 0 14px; font-size: 22px; }
    label { display: block; font-size: 12px; color: #5c6774; margin: 10px 0 4px; }
    input, textarea { width: 100%; border: 1px solid #cfd6de; border-radius: 6px; padding: 8px 10px; font: inherit; font-size: 14px; background: #fff; }
    textarea { height: 68px; resize: none; }
    .actions { display: flex; gap: 8px; margin-top: 16px; }
    button { border: 0; border-radius: 6px; padding: 9px 14px; font: inherit; font-size: 14px; }
    .primary { background: #1f4e45; color: #fff; }
    .ghost { background: #e7ebef; color: #1c2430; }
    .preview { padding: 22px; display: flex; justify-content: center; }
    .paper { width: 430px; height: 520px; background: #fff; border: 1px solid #e1e5ea; padding: 28px 32px; }
    .paper h2 { margin: 0; font-family: Georgia, serif; font-size: 26px; font-weight: 500; }
    .paper p { margin: 4px 0 0; color: #5c6774; font-size: 12px; }
    .rule { height: 1px; background: #1c2430; margin: 12px 0; }
    .paper h3 { margin: 12px 0 4px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    .line { height: 8px; background: #e8edf1; border-radius: 4px; margin: 7px 0; }
  </style>
</head>
<body>
  <div class="window">
    <div class="titlebar"><span class="dots"><i></i><i></i><i></i></span> Resume Builder</div>
    <div class="body">
      <form>
        <h1>New resume</h1>
        <label>Full name</label>
        <input value="Dhanush P. Soorya">
        <label>Email</label>
        <input value="dhanush.soorya@s.amity.edu">
        <label>Education</label>
        <textarea>B.Tech Computer Science, Amity University, Bengaluru</textarea>
        <label>Experience</label>
        <textarea>Backend Developer Intern, Code Alpha</textarea>
        <div class="actions">
          <button class="ghost" type="button">Save</button>
          <button class="primary" type="button">Export resume</button>
        </div>
      </form>
      <div class="preview">
        <div class="paper">
          <h2>Dhanush P. Soorya</h2>
          <p>Bengaluru · Computer Science</p>
          <div class="rule"></div>
          <h3>Education</h3>
          <div class="line" style="width:92%"></div>
          <div class="line" style="width:70%"></div>
          <h3>Experience</h3>
          <div class="line" style="width:88%"></div>
          <div class="line" style="width:76%"></div>
          <div class="line" style="width:64%"></div>
          <h3>Skills</h3>
          <div class="line" style="width:80%"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
