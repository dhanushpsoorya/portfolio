<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Unemployment trends</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1400px; height: 640px; overflow: hidden; background: #eef1f4; font-family: "Segoe UI", sans-serif; color: #1c2430; }
    .app { height: 640px; padding: 22px 26px 18px; display: flex; flex-direction: column; gap: 14px; }
    header { display: flex; justify-content: space-between; align-items: baseline; }
    h1 { margin: 0; font-size: 28px; font-weight: 650; letter-spacing: -0.03em; }
    header span { color: #5c6774; font-size: 15px; }
    .grid { flex: 1; display: grid; grid-template-columns: 1.4fr 1fr 1fr 1.15fr; gap: 14px; }
    .panel { background: #fff; border: 1px solid #e2e6eb; border-radius: 12px; padding: 14px 14px 10px; display: flex; flex-direction: column; }
    h2 { margin: 0 0 8px; font-size: 14px; font-weight: 650; }
    svg { width: 100%; height: 100%; }
    .legend { display: flex; gap: 12px; font-size: 12px; color: #5c6774; margin-top: 4px; }
    .dot { width: 8px; height: 8px; border-radius: 99px; display: inline-block; margin-right: 5px; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Global unemployment trends</h1>
      <span>Wide-to-long cleanup · country, gender, age, time</span>
    </header>
    <div class="grid">
      <section class="panel">
        <h2>Over time</h2>
        <svg viewBox="0 0 360 250">
          <g stroke="#e6ebf0" stroke-width="1">
            <line x1="36" y1="20" x2="36" y2="210"/>
            <line x1="36" y1="210" x2="340" y2="210"/>
            <line x1="36" y1="160" x2="340" y2="160"/>
            <line x1="36" y1="110" x2="340" y2="110"/>
            <line x1="36" y1="60" x2="340" y2="60"/>
          </g>
          <polyline fill="none" stroke="#1f4e45" stroke-width="3" points="36,150 78,142 120,138 162,134 204,96 246,112 288,128 330,136"/>
          <polyline fill="none" stroke="#7a2e24" stroke-width="3" points="36,168 78,162 120,158 162,154 204,118 246,132 288,146 330,152"/>
          <g fill="#708090" font-size="11">
            <text x="48" y="230">2016</text>
            <text x="150" y="230">2019</text>
            <text x="250" y="230">2022</text>
          </g>
        </svg>
        <div class="legend"><span><i class="dot" style="background:#1f4e45"></i>Women</span><span><i class="dot" style="background:#7a2e24"></i>Men</span></div>
      </section>
      <section class="panel">
        <h2>By gender</h2>
        <svg viewBox="0 0 220 250">
          <line x1="28" y1="200" x2="200" y2="200" stroke="#d5dbe2"/>
          <rect x="48" y="78" width="42" height="122" rx="4" fill="#1f4e45"/>
          <rect x="118" y="98" width="42" height="102" rx="4" fill="#7a2e24"/>
          <g fill="#1c2430" font-size="13" text-anchor="middle">
            <text x="69" y="222">Women</text>
            <text x="139" y="222">Men</text>
          </g>
        </svg>
      </section>
      <section class="panel">
        <h2>By age group</h2>
        <svg viewBox="0 0 220 250">
          <line x1="24" y1="200" x2="206" y2="200" stroke="#d5dbe2"/>
          <rect x="28" y="46" width="32" height="154" rx="4" fill="#7a2e24"/>
          <rect x="72" y="92" width="32" height="108" rx="4" fill="#1f4e45"/>
          <rect x="116" y="110" width="32" height="90" rx="4" fill="#1f4e45"/>
          <rect x="160" y="128" width="32" height="72" rx="4" fill="#c4a484"/>
          <g fill="#1c2430" font-size="11" text-anchor="middle">
            <text x="44" y="220">15–24</text>
            <text x="88" y="220">25–34</text>
            <text x="132" y="220">35–54</text>
            <text x="176" y="220">55+</text>
          </g>
        </svg>
      </section>
      <section class="panel">
        <h2>By country</h2>
        <svg viewBox="0 0 260 250">
          <g fill="#1f4e45">
            <rect x="92" y="28" width="150" height="22" rx="4"/>
            <rect x="92" y="66" width="124" height="22" rx="4"/>
            <rect x="92" y="104" width="108" height="22" rx="4"/>
            <rect x="92" y="142" width="86" height="22" rx="4"/>
            <rect x="92" y="180" width="64" height="22" rx="4" fill="#c4a484"/>
          </g>
          <g fill="#5c6774" font-size="12">
            <text x="4" y="44">North</text>
            <text x="4" y="82">West</text>
            <text x="4" y="120">South</text>
            <text x="4" y="158">East</text>
            <text x="4" y="196">Central</text>
          </g>
        </svg>
      </section>
    </div>
  </div>
</body>
</html>
