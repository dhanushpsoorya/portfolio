<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hospital</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1400px; height: 640px; overflow: hidden; background: #f3f6f4; font-family: "Segoe UI", sans-serif; color: #1c2430; }
    header { height: 72px; background: #fff; border-bottom: 1px solid #e3e8e4; display: flex; align-items: center; justify-content: space-between; padding: 0 36px; }
    .brand { font-size: 20px; font-weight: 700; color: #1f4e45; }
    nav { display: flex; gap: 22px; font-size: 15px; }
    nav a { color: #1c2430; text-decoration: none; }
    nav a.on { color: #1f4e45; font-weight: 650; }
    main { height: 568px; display: grid; grid-template-columns: 1.15fr .85fr; gap: 28px; padding: 36px 36px 0; }
    h1 { margin: 18px 0 8px; font-size: 46px; letter-spacing: -0.03em; line-height: 1.05; }
    .lead { margin: 0; font-size: 20px; color: #4d5b55; max-width: 460px; }
    .pills { display: flex; gap: 8px; margin-top: 22px; flex-wrap: wrap; }
    .pills span { background: #fff; border: 1px solid #d7e0da; border-radius: 999px; padding: 8px 12px; font-size: 14px; }
    .card { background: #fff; border-radius: 16px; padding: 22px 22px 18px; border: 1px solid #e3e8e4; box-shadow: 0 10px 30px rgba(31,78,69,.06); }
    h2 { margin: 0 0 14px; font-size: 22px; }
    label { display: block; font-size: 12px; color: #5c6b64; margin: 8px 0 4px; }
    input, select { width: 100%; height: 40px; border: 1px solid #d5ded8; border-radius: 8px; padding: 0 10px; font: inherit; font-size: 15px; background: #fff; }
    button { margin-top: 16px; width: 100%; height: 42px; border: 0; border-radius: 8px; background: #1f4e45; color: #fff; font: inherit; font-size: 15px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">Our New Hospital</div>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Services</a>
      <a class="on" href="#">Book Appointment</a>
      <a href="#">Login</a>
      <a href="#">Register</a>
    </nav>
  </header>
  <main>
    <section>
      <h1>Your health is our priority.</h1>
      <p class="lead">Book a visit, create an account, and choose a doctor and a date.</p>
      <div class="pills">
        <span>General Consultation</span>
        <span>Specialist Doctors</span>
        <span>Emergency Services</span>
        <span>Pharmacy</span>
      </div>
    </section>
    <form class="card">
      <h2>Book an Appointment</h2>
      <label>Your Name</label>
      <input value="">
      <label>Select Doctor</label>
      <select>
        <option>Dr. Smith</option>
        <option>Dr. Jones</option>
        <option>Dr. Lee</option>
      </select>
      <label>Date</label>
      <input type="text" value="2026-10-20">
      <button type="button">Book Appointment</button>
    </form>
  </main>
</body>
</html>
